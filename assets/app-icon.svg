<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512"
     role="img" aria-label="Device Center">
  <title>Device Center</title>

  <!-- Night tile, with a hairline edge so it still reads on a dark taskbar -->
  <rect width="512" height="512" rx="114" fill="#0A0B0F"/>
  <rect x="4" y="4" width="504" height="504" rx="110" fill="none" stroke="#22252F" stroke-width="8"/>

  <!-- Level ring: track plus a ~73% accent arc starting at twelve o'clock -->
  <circle cx="256" cy="256" r="170" fill="none" stroke="#22252F" stroke-width="30"/>
  <circle cx="256" cy="256" r="170" fill="none" stroke="#7C5CFF" stroke-width="30"
          stroke-linecap="round" stroke-dasharray="780 1068" transform="rotate(-90 256 256)"/>

  <!-- assets/mark.svg on its 24-unit grid, centred at scale 9 -->
  <g transform="translate(149.8 145.3) scale(9)" fill="none" stroke="#FFFFFF">
    <path d="M4.6 13.2 A7.2 7.2 0 0 1 19 13.2"
          stroke-width="2" stroke-linecap="round"/>
    <circle cx="4.6" cy="16" r="2.6" fill="#FFFFFF" stroke="none"/>
    <circle cx="19" cy="16" r="2.2" stroke-width="1.7"/>
  </g>
</svg>
