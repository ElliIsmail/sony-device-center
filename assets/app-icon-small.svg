<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512"
     role="img" aria-label="Device Center">
  <title>Device Center (16-32 px)</title>

  <!-- Hinted variant of app-icon.svg for 16-32 px renders (tray, taskbar,
       .ico small sizes): no edge line, a heavier ring and a larger, bolder
       mark, so each element still covers whole pixels. -->
  <rect width="512" height="512" rx="114" fill="#0A0B0F"/>

  <circle cx="256" cy="256" r="176" fill="none" stroke="#2F3341" stroke-width="56"/>
  <circle cx="256" cy="256" r="176" fill="none" stroke="#7C5CFF" stroke-width="56"
          stroke-linecap="round" stroke-dasharray="807 1106" transform="rotate(-90 256 256)"/>

  <g transform="translate(129 131.6) scale(10.5)" fill="none" stroke="#FFFFFF">
    <path d="M4.6 13.2 A7.2 7.2 0 0 1 19 13.2"
          stroke-width="2.6" stroke-linecap="round"/>
    <circle cx="4.6" cy="16" r="3" fill="#FFFFFF" stroke="none"/>
    <circle cx="19" cy="16" r="2.5" stroke-width="2.2"/>
  </g>
</svg>
